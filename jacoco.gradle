/**
 * JaCoCo code coverage configuration for Android project
 * Generates unified coverage reports for unit and instrumentation tests
 */

apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.10"
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

/**
 * Task to generate unified JaCoCo test report
 * Combines coverage from unit tests and Android instrumentation tests
 */
task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest', 'createDebugCoverageReport']) {
    group = "Reporting"
    description = "Generate Jacoco coverage reports for Debug build"

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        // Android framework
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        
        // Dagger/Hilt generated
        '**/*_MembersInjector.class',
        '**/Dagger*Component*.*',
        '**/*Module_*Factory.class',
        '**/di/*',
        '**/*_Factory*.*',
        '**/*_Provide*Factory*.*',
        '**/*_HiltModules*.*',
        '**/*Hilt_*.*',
        
        // Data classes and DTOs
        '**/dto/**',
        '**/model/**/*$*.class',
        
        // UI (focus on business logic)
        '**/databinding/*',
        '**/android/databinding/*',
        '**/androidx/databinding/*',
        '**/BR.class',
        
        // Kotlin metadata
        '**/*$WhenMappings*.*',
        '**/*$Companion*.*'
    ]

    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/code_coverage/debugAndroidTest/connected/**/*.ec'
    ]))
}

/**
 * Coverage verification task
 * Enforces minimum coverage thresholds
 */
task jacocoCoverageVerification(type: JacocoCoverageVerification) {
    dependsOn jacocoTestReport
    
    violationRules {
        rule {
            limit {
                minimum = 0.60  // 60% overall coverage
            }
        }
        
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50  // 50% line coverage per class
            }
            excludes = [
                // Exclude generated files
                '*.BuildConfig',
                '*.R',
                '*.R$*',
                // Exclude UI (focus on business logic)
                '*.ui.*',
                // Exclude DI modules
                '*.di.*'
            ]
        }
        
        rule {
            element = 'PACKAGE'
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.40  // 40% branch coverage
            }
        }
    }
}

// Make check task depend on coverage verification
project.tasks.check.dependsOn jacocoCoverageVerification

/**
 * Task to print coverage summary
 */
task printCoverageSummary {
    dependsOn jacocoTestReport
    
    doLast {
        def reportFile = file("${buildDir}/reports/jacoco/jacocoTestReport/html/index.html")
        if (reportFile.exists()) {
            println "\n========================================="
            println "Code Coverage Report Generated"
            println "========================================="
            println "HTML Report: ${reportFile.absolutePath}"
            println "XML Report:  ${buildDir}/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
            println "\nOpen the HTML report in a browser to view detailed coverage metrics."
            println "=========================================\n"
        }
    }
}
